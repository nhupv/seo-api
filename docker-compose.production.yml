version: '3'
services:
  nest-api:
    container_name: nest-api-pro
    image: nest-api-pro:1.0.0
    build:
      context: .
      dockerfile: ./Dockerfile-pro
    command: npm run start:prod
    ports:
      - '${APP_PORT}:4000'
    networks:
      - nestapi
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
  mongo:
    image: mongo
    container_name: mongodb-nest
    restart: always
    ports:
      - '${MONGO_PORT}:27017'
    environment:
      MONGO_INITDB_DATABASE: '${DATABASE}'
      MONGO_INITDB_ROOT_USERNAME: '${DATABASE_USER}'
      MONGO_INITDB_ROOT_PASSWORD: '${DATABASE_PASSWORD}'
    volumes:
      - nestmongo:/data/db
    networks:
      - nestapi
  redis:
    image: redis:alpine
    container_name: redis-nest
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - nestredis:/data
    networks:
      - nestapi
networks:
  nestapi:
    driver: 'bridge'
volumes:
  nestredis:
    driver: 'local'
  nestmongo:
    driver: 'local'
