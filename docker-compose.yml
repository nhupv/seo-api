version: '3'
services:
  nest-api:
    container_name: nest-api
    image: nest-api:1.0.0
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      - mongo
      - redis
    command: npm run start:dev
    ports:
      - '${APP_PORT}:4000'
      - '9229:9229'
    networks:
      - nestapi
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
  mongo:
    image: mongo
    container_name: mongodb-nest
    restart: always
    ports:
      - '${MONGO_PORT}:27017'
    environment:
      MONGO_INITDB_DATABASE: '${DATABASE}'
      MONGO_INITDB_ROOT_USERNAME: '${DATABASE_USER}'
      MONGO_INITDB_ROOT_PASSWORD: '${DATABASE_PASSWORD}'
    volumes:
      - nestredis:/data/db
    networks:
      - nestapi
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - '${REDIS_PORT}:${REDIS_PORT_LOCAL}'
    volumes:
      - nestredis:/data
    networks:
      - nestapi
networks:
  nestapi:
    driver: 'bridge'
volumes:
  nestredis:
    driver: 'local'
  nestmongo:
    driver: 'local'
